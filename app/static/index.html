function renderPresets(){
  const cur = DATA.miners && DATA.miners.ok ? (DATA.miners.pct_of_scanned || 0) : null;
  // Escenarios de referencia, derivados y no clavados: el umbral que pide
  // el BIP, la mitad de ese umbral, y la cuota del mayor pool de hoy.
  const top = DATA.pools && DATA.pools.ok && DATA.pools.pools.length
            ? DATA.pools.pools[0].share_pct : 27;
  const vals = [...new Set([1, 5, 10, Math.round(top), Math.round(thrPct()/2), thrPct()])]
               .filter(v => v > 0 && v <= 60).sort((a,b) => a-b);
  let html = vals.map(v => `<button type="button" class="pbtn" onclick="setShare(${v})">${num(v,1)}%</button>`).join("");
  if(cur != null) html += `<button type="button" class="pbtn" onclick="setShare(${cur})">${esc(t("current"))} ${num(cur,2)}%</button>`;
  $("presets").innerHTML = html;
}
function setShare(pct){ $("share").value = Math.round(Math.min(60, Math.max(0.1, pct)) * 10); renderSim(); }

function renderSim(){
  const share = Math.max(0.001, $("share").value / 1000);
  const spacing = (DATA.params && DATA.params.target_spacing) || 600;
  const period = bip().period || 2016;
  const interval = spacing / share;
  const perDay = 86400 / interval;
  const retargetDays = interval * period / 86400;
  const majority = spacing / Math.max(1e-9, 1 - share);

  $("shareval").textContent = num(share * 100, 2) + "%";
  const iTxt = interval < 3600 ? num(interval/60,1) + " " + t("minutes") : num(interval/3600,1) + " " + t("hours");
  const rTxt = retargetDays < 365 ? num(retargetDays,0) + " " + t("days") : num(retargetDays/365,2) + " " + t("years");

  $("simout").innerHTML = `
    <div class="card"><div class="lbl">${esc(t("simInterval"))}</div>
      <div class="val o">${esc(iTxt)}</div>
      <div class="note">${esc(t("ofNormal", {n: num(share*100, 2)}))}</div></div>
    <div class="card"><div class="lbl">${esc(t("simPerDay"))}</div>
      <div class="val">${num(perDay, 2)}</div>
      <div class="note">${esc(t("simPerDayNote", constVars()))}</div></div>
    <div class="card"><div class="lbl">${esc(t("simRetarget"))}</div>
      <div class="val b">${esc(rTxt)}</div>
      <div class="note">${num(retargetDays, 0)} ${esc(t("days"))}</div></div>
    <div class="card"><div class="lbl">${esc(t("simMajority"))}</div>
      <div class="val g">${num(majority/60, 1)} ${esc(t("minutes"))}</div>
      <div class="note">${esc(t("simMajNote"))}</div></div>`;
  $("simviable").innerHTML = share >= 0.5 ? `<div class="viable">${esc(t("simViable"))}</div>` : "";
}

/* Las fechas del BIP son alturas, y en una cadena lenta llegan tarde.
   Los plazos NO se calculan aqui: vienen de signaling.milestone_projection
   por /api/miners. El navegador solo reparte anchuras. */
/* La unidad se elige por la cifra QUE SE IMPRIME, no por la de dentro.
   0,6 dias se imprime como "1" y pedia singular; 1,4 tambien. Mirar el
   numero crudo habria dado "1 dias" en el primero y "1 dia" en el segundo,
   con el mismo texto en pantalla. */
function unidad(mostrado, sing, plu){ return t(Math.abs(mostrado) === 1 ? sing : plu); }

function strDur(dias){
  if(dias === null || dias === undefined) return t("strNeverRow");
  if(dias < 365) return num(dias, 0) + " " + unidad(Math.round(dias), "day", "days");
  const a = dias / 365.25;
  return num(a, 2) + " " + unidad(Math.round(a * 100) / 100, "year", "years");
}
/* La marca existe para que el banco de pruebas pueda comprobar que un hito
   inalcanzable NO imprime un plazo. Atarlo a la palabra "nunca" no valia:
   esa palabra sale en otros textos de la pagina, asi que la comprobacion
   daba positivo siempre y no comprobaba nada. */
/* El ritmo nominal de la cadena no se escribe: sale de /api/params. Decir
   "diez minutos" en el texto lo convierte en mentira el dia que se toque, y
   nadie relee los textos buscando cantidades escritas con letras. */
function normalSpacing(){
  const sp = (DATA.params && DATA.params.target_spacing) || 600;
  if(sp < 3600) return num(sp/60, 0) + " " + unidad(Math.round(sp/60), "minute", "minutes");
  const h = sp / 3600;
  return num(h, 1) + " " + unidad(Math.round(h * 10) / 10, "hour", "hours");
}
function strNeverCls(dias){ return (dias === null || dias === undefined) ? " is-never" : ""; }
function renderStretch(){
  const d = DATA.miners, lead = $("strlead"), rails = $("strrails"), rows = $("strrows");
  if(!d){ return; }
  if(!d.ok || !d.milestone_projection){
    lead.textContent = ""; rows.innerHTML = "";
    // Nunca un error vacio. Con el campo ausente y sin error que contar,
    // la seccion se quedaba en blanco y parecia texto estatico: no decia
    // ni que faltaba un dato ni por que. Un error mudo es peor que ninguno.
    rails.innerHTML = d.computing
      ? `<div class="computing">${esc(t("computing"))}</div>`
      : `<div class="err">${esc(errTxt(d) || t("strNoData"))}</div>`;
    return;
  }
  const p = d.milestone_projection;
  const ms = p.milestones || [];
  const share = p.share_pct || 0;
  // Sin umbral conocido no se afirma que no habria separacion: con 100 la
  // rama "no hay split" no se dispara nunca. Escribir 55 aqui seria clavar
  // el parametro justo donde nadie lo releeria.
  const thr = d.threshold_pct || (DATA.params && DATA.params.threshold_pct) || 100;
  const nombres = {forced_lockin:"strMs2", rules_active:"strMs3", rules_expire:"strMs4"};

  const mc = d.minority_chain || {};
  const iv = mc.interval_hours;
  /* Con la separacion ya ocurrida, la cuota no se supone: se mide, y el
     texto tiene que decirlo. Antes esta seccion llegaba a afirmar que no
     habria cadena minoritaria mientras la seccion de arriba la estaba
     midiendo. */
  const medida = d.share_source === "observed";

  /* HUECO DE SINCRONIA, Y NO PUEDE LLENARSE CON UNA MENTIRA.
     La cuota medida entra cuando se recalcula esta seccion, y su cache dura
     minutos. Justo despues de arrancar el contenedor, la comparacion de
     cadenas todavia no existia cuando se calculo esto, asi que llega con
     cuota cero y con la separacion ya ocurrida: la combinacion que imprimia
     "no habria cadena minoritaria" con la cadena minoritaria medida arriba.
     Mientras dure ese desfase no se afirma nada: se dice que se esta
     rehaciendo. */
  if(realState() === "split" && share <= 0 && !medida){
    lead.textContent = t("strRecalc");
    rails.innerHTML = ""; rows.innerHTML = "";
    return;
  }
  const vars = {splitHeight: num(p.fork_height, 0), share: num(share, 2),
                interval: iv ? num(iv, 1) + " " + t("hours") : "…",
                normal: normalSpacing()};
  const a1 = $("strAssume1");
  if(a1) a1.textContent = t(medida ? "strAssume1Obs" : "strAssume1");
  lead.textContent = (share <= 0 && !medida) ? t("strNever")
                   : share >= thr ? t("strNoSplit")
                   : t(medida ? "strLeadObs" : "strLead", vars);

  // Escala del eje: el hito lento mas lejano. Con cuota 0 no hay escala y
  // el rail se dibuja abierto, sin punto final ni eje.
  const lentos = ms.map(m => m.minority_days).filter(v => v !== null && isFinite(v));
  const finito = lentos.length === ms.length && ms.length > 0;
  const max = finito ? Math.max.apply(null, lentos.concat([1])) : 0;
  const pos = v => (max > 0 && isFinite(v)) ? Math.min(100, Math.max(0, v / max * 100)) : 0;

  const puntos = (campo) => ms.map(m => {
    const v = m[campo];
    return (v === null || v === undefined) ? "" :
      `<span class="str-pt" style="left:${pos(v)}%"></span>`;
  }).join("");

  const ultimoRapido = ms.length ? ms[ms.length-1].nominal_days : 0;
  let ejeHtml = "";
  if(finito && max > 0){
    const anios = Math.max(1, Math.ceil(max/365.25));
    let ticks = "";
    for(let a = 0; a <= anios; a++){
      const dias = a * 365.25;
      if(dias > max) break;
      // Singular y plural. "1 años" se leia en el eje del primer render.
      ticks += `<span class="str-tick" style="left:${pos(dias)}%"><span>${
        a === 0 ? esc(t("strAxis0"))
                : esc(t(a === 1 ? "strAxisY1" : "strAxisYn", {n: num(a,0)}))}</span></span>`;
    }
    ejeHtml = `<div class="str-axis">${ticks}</div>`;
  }

  rails.innerHTML = `
    <div class="str-rail is-fast">
      <div class="str-rail-k">${esc(t("strRailFast"))}</div>
      <div class="str-line"><span class="str-fill" style="width:${pos(ultimoRapido)}%"></span>${puntos("nominal_days")}</div>
    </div>
    <div class="str-rail is-slow">
      <div class="str-rail-k">${esc(t("strRailSlow", {share: num(share, 2)}))}</div>
      <div class="str-line${finito ? "" : " is-open"}"><span class="str-fill" style="width:${finito ? 100 : 100}%"></span>${finito ? puntos("minority_days") : ""}</div>
    </div>${ejeHtml}`;

  $("strassume3").textContent = t("strAssume3", Object.assign(constVars(),
    {cap: num(p.max_retarget_drop || 4, 0)}));

  rows.innerHTML = ms.map(m => {
    const lento = m.minority_days;
    const anchoLento = lento === null ? 100 : pos(lento);
    const anchoRapido = lento === null ? 0 : pos(m.nominal_days);
    const mult = (m.slowdown === null || m.slowdown === undefined) ? "" :
      `<div class="str-mult">${t("strMult", {x: "<b>" + num(m.slowdown, 1) + "</b>"})}</div>`;
    return `<div class="str-row">
      <div class="str-row-h"><b>${esc(t(nombres[m.key] || m.key))}</b>
        <span class="str-height">${esc(t("strAtHeight", {h: num(m.height, 0)}))}</span></div>
      <div class="str-cmp"><span class="k">${esc(t("strKFast"))}</span>
        <span class="b"><i style="width:${anchoRapido}%"></i></span>
        <span class="v">${esc(strDur(m.nominal_days))}</span></div>
      <div class="str-cmp slow"><span class="k">${esc(t("strKSlow"))}</span>
        <span class="b"><i style="width:${anchoLento}%"></i></span>
        <span class="v${strNeverCls(lento)}">${esc(strDur(lento))}</span></div>
      ${mult}</div>`;
  }).join("");
}

/* ===================== arranque ===================== */
function renderAll(){
  paintStatic(); paintDonate(); paintFresh(); renderHeroStatus();
  renderChain(); renderTimeline(); renderMiners();
  renderPools(); renderNodes(); renderPresets(); renderSim(); renderStretch();
}

document.documentElement.lang = LANG;
aplicarTema();
// Si no hay eleccion guardada, seguir al sistema si cambia sobre la marcha.
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  if(mq.addEventListener) mq.addEventListener("change", e => {
    let guardado = null;
    try{ guardado = localStorage.getItem("bip110theme"); }catch(err){}
    if(!guardado){ TEMA = e.matches ? "light" : "dark"; aplicarTema(); }
  });
}
$("share").addEventListener("input", renderSim);
window.addEventListener("scroll", () => {
  const b = $("totop");
  if(window.scrollY > 600) b.removeAttribute("hidden"); else b.setAttribute("hidden", "");
}, {passive: true});
renderAll();

/* Nunca hacer JSON.parse a ciegas.
   Un CDN por delante puede devolver su propia pagina de error (un 524 en
   texto plano, por ejemplo) y el navegador reventaba con un error de
   sintaxis que no explicaba nada. Se comprueba el estado y el tipo antes
   de intentar leerlo. */
function pedirJson(url){
  return fetch(url, {headers: {"Accept": "application/json"}}).then(r => {
    const tipo = r.headers.get("content-type") || "";
    if(!r.ok || tipo.indexOf("json") < 0){
      return r.text().catch(() => "").then(() => ({
        ok: false,
        http: r.status,
        error: t(r.status === 524 || r.status === 504 ? "errTimeout" : "errHttp",
                 {code: r.status}),
      }));
    }
    return r.json().catch(() => ({ok: false, error: t("errBadJson")}));
  });
}

function load(name, url){
  const before = realState();
  return pedirJson(url)
    .then(d => {
      DATA[name] = d;
      // Si el estado real cambia (por ejemplo, se separan las cadenas), se
      // vuelve a la realidad aunque el visitante estuviera mirando una
      // vista previa. Lo que esta pasando manda sobre lo que se estaba
      // curioseando.
      if(name === "chain" && realState() !== before) VIEW = null;
      renderAll();
      // Si el servidor esta calculando por primera vez, se vuelve a
      // preguntar en un rato en lugar de dejar el hueco vacio.
      if(d && d.computing) setTimeout(() => load(name, url), 20000);
    })
    .catch(e => { DATA[name] = {ok:false, error:String(e)}; renderAll(); });
}

/* El panel se actualiza solo. Sin esto, quien tuviera la pagina abierta el
   dia de la separacion no se enteraria hasta recargar. La comparacion de
   cadenas es barata (unas 20 llamadas), asi que puede ir fresca; el resto
   cuesta mucho mas y va mucho mas espaciado. */
function autoRefresh(){
  // El "hace X" tiene que avanzar aunque no entren datos: si el panel se
  // quedara mudo, el contador subiendo es la senal de que algo pasa.
  setInterval(paintFresh, 10000);
  setInterval(() => load("chain",  "/api/chain"),  60 * 1000);
  setInterval(() => load("miners", "/api/miners"), 5 * 60 * 1000);
  setInterval(() => { load("history","/api/history"); load("pools","/api/pools"); },
              30 * 60 * 1000);
}
load("params", "/api/params");
load("history","/api/history");
load("chain",  "/api/chain");
load("miners", "/api/miners");
load("pools",  "/api/pools");
load("nodes",  "/api/nodes");
autoRefresh();
</script>
