/* ------------------------------------------------------------------
   Dos temas.
   El panel nacio oscuro y el oscuro sigue siendo el de casa, pero mucha
   gente lee de dia y con el movil al sol. Los colores del modo claro no
   son los mismos aclarados: el naranja y el verde se oscurecen, porque
   los tonos que contrastan sobre negro se vuelven ilegibles sobre blanco,
   y aqui el color no es decoracion: distingue un dato verificable de una
   muestra sesgada. Si el naranja se pierde, el aviso se pierde.
   ------------------------------------------------------------------ */
:root{
  --bg:#0d0f12;      --bg-rgb:13,15,18;
  --panel:#161a20;   --panel2:#1e232b;  --panel3:#12151a;
  --line:#2b323d;    --line2:#3a424f;
  --txt:#eceef1;     --txt2:#d6dae0;    --dim:#a8b0bd;   --dim2:#9aa4b2;
  --orange:#E7640F;  --orange-t:#FF8A3D; --orange-2:#ff8534; --orange-rgb:231,100,15;
  --green:#4CC96A;   --green-rgb:76,201,106;
  --blue:#5AA9E6;    --blue-rgb:90,169,230;
  --red:#FF6B61;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f7fa;      --bg-rgb:245,247,250;
  --panel:#ffffff;   --panel2:#eef1f6;  --panel3:#e7ebf1;
  --line:#d8dee7;    --line2:#b9c2ce;
  --txt:#11151c;     --txt2:#2b3340;    --dim:#4a5462;   --dim2:#545d6b;
  --orange:#C4520C;  --orange-t:#A8440A; --orange-2:#D4691A; --orange-rgb:196,82,12;
  --green:#0D5F2D;   --green-rgb:13,95,45;
  --blue:#175FA8;    --blue-rgb:23,95,168;
  --red:#B3271A;
  color-scheme:light;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;font-size:17px;line-height:1.6;font-weight:350;letter-spacing:-.003em}
a{color:var(--orange-t);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--txt)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.wrap{max-width:70rem;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{border-radius:50%;flex-shrink:0;display:block}
h1{font-size:30px;font-weight:650;line-height:1.15;letter-spacing:-.02em}
h1 span{color:var(--orange-t)}
.tagline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--dim2);margin-top:6px}
nav{display:flex;gap:4px;flex-shrink:0}
.lang{min-height:44px;min-width:44px;padding:0 14px;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.lang[aria-pressed="true"]{background:rgba(var(--orange-rgb), .14);border-color:var(--orange);color:var(--orange-t);font-weight:600}

header{position:sticky;top:0;z-index:20;background:rgba(var(--bg-rgb), .92);backdrop-filter:blur(8px);padding-top:14px}
@media (max-width:36rem){.logo{width:34px;height:34px}h1{font-size:24px}.tagline{display:none}}

.brand{text-decoration:none;color:inherit}
.brand:hover h1 span{color:var(--txt)}
.fresh{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:var(--dim2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0;transition:background .3s}
.dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(var(--green-rgb), .18)}
.dot.old{background:var(--orange)}
.totop{position:fixed;right:16px;bottom:16px;z-index:30;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);text-decoration:none;font-size:20px;line-height:1}
.totop:hover{border-color:var(--orange);color:var(--orange-t)}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
.donate-nav{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;
  border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:14px;text-decoration:none}
.donate-nav:hover{border-color:var(--orange);color:var(--orange-t)}

.donate{margin-top:56px;background:linear-gradient(180deg,rgba(var(--orange-rgb), .08),rgba(var(--orange-rgb), .02));
  border:1px solid rgba(var(--orange-rgb), .28);border-radius:12px;padding:24px;scroll-margin-top:96px}
.donate-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-t)}
.donate h2{font-size:22px;margin-top:8px}
.donate-body{font-size:16px;color:var(--txt2);max-width:62ch;margin-top:8px}
.donate-priv{font-size:14px;color:var(--dim);max-width:66ch;margin-top:16px}
.pay{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.pay-row{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.pay-lbl{grid-column:1/-1;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.pay-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--txt);
  word-break:break-all;line-height:1.45}
.pay-val.sp{font-size:12.5px;color:var(--dim)}
.pay-btns{display:flex;gap:8px;flex-shrink:0}
.paybtn{min-height:40px;padding:0 14px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:8px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;
  display:inline-flex;align-items:center}
.paybtn:hover{border-color:var(--orange);color:var(--orange-t)}
.paybtn.primary{background:rgba(var(--orange-rgb), .14);border-color:var(--orange);color:var(--orange-t)}
@media (max-width:34rem){.pay-row{grid-template-columns:1fr}.pay-btns{margin-top:4px}}

section{margin-top:48px}
h2{font-size:24px;font-weight:650;letter-spacing:-.015em}
h3{font-size:20px;font-weight:550}
.shead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.method{color:var(--dim);font-size:15px;max-width:70ch}

.pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.p-data{background:rgba(var(--green-rgb), .14);color:var(--green);border:1px solid rgba(var(--green-rgb), .35)}
.p-est{background:rgba(var(--blue-rgb), .14);color:var(--blue);border:1px solid rgba(var(--blue-rgb), .35)}
.p-sample{background:rgba(var(--orange-rgb), .14);color:var(--orange-t);border:1px solid rgba(var(--orange-rgb), .35)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.t-data{border-top:3px solid var(--green);border-radius:0 0 12px 12px}
.t-est{border-top:3px solid var(--blue);border-radius:0 0 12px 12px}
.t-sample{border-top:3px solid var(--orange);border-radius:0 0 12px 12px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr))}
.grid-15{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.grid-14{grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.grid-17{grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))}
.grid-11{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:700;margin-top:6px}
.note{font-size:13px;color:var(--dim2);margin-top:4px}
.o{color:var(--orange-t)}.g{color:var(--green)}.b{color:var(--blue)}

/* Aviso anclado. Nunca se colapsa, nunca se esconde. */
.caveat{border-left:2px solid var(--line2);padding-left:14px;margin-top:16px}
.caveat--sample{border-left-color:var(--orange)}
.caveat--est{border-left-color:var(--blue)}
.caveat--ok{border-left-color:var(--green)}
.caveat-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.caveat--sample .caveat-k{color:var(--orange-t)}
.caveat--est .caveat-k{color:var(--blue)}
.caveat--ok .caveat-k{color:var(--green)}
.caveat-b{font-size:14px;color:var(--dim);margin-top:4px;max-width:68ch}

.answer{background:linear-gradient(180deg,rgba(var(--green-rgb), .09),rgba(var(--green-rgb), .02));border:1px solid rgba(var(--green-rgb), .3);border-radius:12px;padding:24px;margin-top:24px}
.answer .q{font-size:20px;color:var(--dim);font-weight:300}
.answer .a{font-size:40px;font-weight:700;color:var(--green);line-height:1.05;margin:8px 0 14px}
.answer p{max-width:66ch}
.answer p+p{margin-top:12px}
.gfa{font-size:24px;font-weight:600;color:var(--green);margin:2px 0 10px}
.answer .lead{font-size:18px;color:var(--txt2);max-width:64ch}
.more.small{margin-top:10px;min-height:36px;padding:0 10px;font-size:14px}
.qabox{margin-top:10px;border-left:2px solid var(--line);padding-left:14px}
.qa+.qa{margin-top:10px}
.qa .q{font-size:14px;font-weight:600;color:var(--txt)}
.qa .a{font-size:14px;color:var(--dim);margin-top:2px;max-width:64ch}
/* Estado y cuenta atras dentro del heroe. Cada tarjeta lleva SU etiqueta:
   los bloques que faltan son dato verificable, la estimacion en dias vive
   en su seccion y no sube aqui. Juntarlas bajo una sola etiqueta habria
   promocionado de nivel la estimacion, que es la linea roja del proyecto. */
.hgrid{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hcard .hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hcard .hlab{font-size:15px;color:var(--dim);flex:1;min-width:0}
.hcard .hval{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;color:var(--green);margin-top:6px}
/* La cuenta atras reutiliza las clases que ya tenia en su seccion, pero
   dentro del heroe compite por el alto del primer viewport, asi que se
   encoge aqui y solo aqui. 56 px de cifra estaban bien en una seccion
   propia y aqui se comen el margen entero. */
/* Los DOS contenedores, no solo el primero. Al partir el heroe en dos para
   meter el aviso de estafas en medio, la cuenta atras se quedo fuera de
   estos ajustes y volvio a los 56 px de su seccion original, que en el
   movil se comen el margen entero. Un selector por id se rompe en silencio
   cuando el nodo cambia de sitio. */
#herostat .cdgrid, #herocd .cdgrid{gap:12px 48px;margin-top:8px}
/* Las dos cajas se reparten la fila en vez de ocupar lo que mida su texto.
   Subir mas la separacion habria funcionado en ingles y habria partido el
   castellano en dos filas otra vez, porque ahi el ancho lo decide la frase
   mas larga. Repartiendo, la separacion no depende del idioma. El minimo de
   220 px es lo que las hace apilarse solas en el movil. */
#herostat .cdbox, #herocd .cdbox{flex:1 1 220px}
#herostat .cdnum, #herocd .cdnum{font-size:34px}
#herostat .cdunit, #herocd .cdunit{font-size:14px;margin-top:4px}
#herostat .cdfoot, #herocd .cdfoot{font-size:14px;margin-top:12px}
/* El verde afirma. Cuando no se puede afirmar, no se pinta de verde: el
   color tambien esta diciendo algo, y decir "todo bien" con un nodo mudo
   es afirmar dos veces lo que no se sabe. */
.hcard .hval.apagado{color:var(--dim)}
/* La calma va pegada al susto. Quien lee "hay dos cadenas" necesita saber
   ahi mismo que a el no le cambia nada; el "No" de la respuesta le queda
   cuatro lineas arriba y para entonces ya se ha asustado. */
.hcalm{margin-top:6px;font-size:15px;color:var(--txt2);line-height:1.5}
/* Las dos huellas, una encima de otra y a la misma anchura, para que la
   diferencia se vea sin leer: es una comparacion, no dos datos sueltos. */
/* Dos columnas en pantalla ancha, apiladas en el movil. Es una comparacion,
   asi que las dos cajas miden lo mismo (1fr y 1fr): si una fuera mas ancha
   que la otra, la maqueta estaria sugiriendo una jerarquia que aqui no
   existe. Cada una con su marco, para que se vea de un vistazo donde acaba
   una huella y empieza la otra. */
.proof{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.proof > div{background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;min-width:0}
.proof .proofh{font-size:17px;font-weight:700;margin-top:6px;word-break:break-all;line-height:1.35}
@media (max-width:640px){ .proof{grid-template-columns:1fr} }
.lagnote{margin-top:8px;font-size:14px;color:var(--orange-t);line-height:1.5}
.bound{margin-top:18px;font-size:15px;color:var(--dim)}
.heroacts{display:flex;gap:8px;flex-wrap:wrap}
.heroacts .more{margin-top:10px}
@media (max-width:520px){
  /* Medido en un movil real: a 369 px el heroe entraba con 55 px de margen
     antes de subirle la cuenta atras entera. Estas bajadas son las que
     mantienen el margen; sin ellas se sale. */
  .answer .a{font-size:34px}
  #herostat .cdnum, #herocd .cdnum{font-size:28px}
}
.more{margin-top:16px;min-height:44px;padding:0 14px;background:transparent;color:var(--orange-t);border:1px solid var(--line2);border-radius:8px;cursor:pointer;font:inherit;font-size:15px}
.more:hover{border-color:var(--orange)}
.more[aria-expanded="true"]{color:var(--dim)}
#answer-more{margin-top:4px}

.states{margin-top:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stbtn{min-height:40px;padding:0 12px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.stbtn[aria-current="true"]{background:rgba(var(--orange-rgb), .14);border-color:var(--orange);color:var(--orange-t);font-weight:600}
.previewnote{font-size:14px;color:var(--dim);max-width:66ch;margin:0 0 14px}
.preview{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--orange-t);padding:2px 8px;border-radius:4px;margin-bottom:12px}

.hashnote{font-size:15px;margin-top:12px;font-weight:550}
.hashnote.ok{color:var(--green)}
.hashnote.no{color:var(--orange-t)}
/* --- recorrido de estados --- */
.track-wrap{margin-top:22px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--orange);border-radius:0 12px 12px 0;padding:18px 20px}
.track-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--orange-t)}
.track-lead{font-size:17px;color:var(--txt);max-width:56ch;margin-top:6px;font-weight:450}
.track-note{font-size:13px;color:var(--dim);max-width:70ch;margin-top:14px}

.track{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px}
.stop{position:relative;background:none;border:0;padding:26px 6px 0;cursor:pointer;
  font:inherit;text-align:center;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;gap:2px;min-height:44px}
/* el tramo hasta la siguiente parada */
.stop:not(:last-child)::after{content:"";position:absolute;top:9px;left:50%;width:100%;
  height:0;border-top:2px solid var(--line2)}
.stop.future::after{border-top-style:dashed}
.stop-dot{position:absolute;top:3px;left:50%;transform:translateX(-50%);
  width:14px;height:14px;border-radius:50%;background:var(--bg);
  border:2px solid var(--line2);z-index:1}
.stop-name{font-size:15px;color:var(--dim)}
.stop-when{font-size:12px;color:var(--dim2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.stop.done .stop-dot{border-color:var(--orange)}
/* Dos cosas distintas, dos canales distintos.
   El RELLENO dice que parada estas mirando. El CONTORNO dice donde
   estamos de verdad. Antes las dos usaban el color del punto y la
   seleccion tapaba a la realidad, asi que el verde de "ahora" no se veia
   nunca al cargar la pagina. Y por si el color no llega (daltonismo,
   pantalla al sol), la parada real lleva ademas la palabra escrita. */
.stop.now .stop-dot{border-color:var(--green);
  outline:2px solid var(--green);outline-offset:3px}
.stop[aria-selected="true"] .stop-name{color:var(--txt);font-weight:600}
.stop[aria-selected="true"] .stop-dot{background:var(--orange);border-color:var(--orange)}
.stop-now{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green);border:1px solid var(--green);border-radius:999px;padding:1px 7px}
.stop:hover .stop-name{color:var(--txt)}
@media (max-width:34rem){
  .track{grid-template-columns:1fr;gap:0}
  .stop{flex-direction:row;text-align:left;align-items:baseline;gap:10px;
    padding:8px 0 8px 30px;min-height:0}
  .stop:not(:last-child)::after{top:22px;left:9px;width:0;height:100%;
    border-top:0;border-left:2px solid var(--line2)}
  .stop.future::after{border-left-style:dashed;border-top-style:solid}
  .stop-dot{top:14px;left:2px;transform:none}
  .stop-when{margin-left:auto}
}

.bigtip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:44px;font-weight:700;line-height:1.05;margin-top:10px}
.chains{margin-top:18px;display:grid;gap:12px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:46rem){.chains{grid-template-columns:1fr}}
.chain-min{background:var(--panel3)}
.pair{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
/* Va pegada al ritmo porque lo matiza: cuando fue el ultimo bloque y sobre
   cuantos va la media. Sin color propio: no es otro nivel epistemico, es la
   misma cifra contada con su base. */
.pacenote{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.5}

.tlrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:0 10px 10px 0;padding:16px}
.tlrow .h{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;min-width:6.5rem}
.tlrow .m{flex:1;min-width:14rem}
.tlrow .m strong{font-weight:550;display:block}
.tlrow .m span{display:block;color:var(--dim);font-size:15px;margin-top:4px}
.tlrow .r{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;color:var(--dim2);min-width:7.5rem}
.tlrow .r b{display:block;color:var(--txt);font-size:17px}

.gapnum{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px}
.gapnum .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:64px;font-weight:700;line-height:1;color:var(--orange-t)}
.gapnum .u{font-size:20px;color:var(--dim)}
/* Contador de cabecera.
   Las dos cifras van a la par y cada una con el color de su nivel: los
   bloques en verde porque son un hecho, el plazo en azul porque es un
   modelo. Ese contraste es lo unico que separa esto de una cuenta atras
   cualquiera, asi que no unificar los colores por estetica. */
.cdgrid{display:flex;flex-wrap:wrap;gap:16px 40px;margin-top:10px}
.cdbox{min-width:0}
.cdnum{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:56px;font-weight:700;line-height:1}
.cdunit{font-size:17px;color:var(--dim);margin-top:8px}
.cdfoot{font-size:15px;color:var(--dim);margin-top:18px;max-width:64ch}
@media(max-width:520px){.cdnum{font-size:42px}}
.bar{position:relative;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:20px 0 8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.barlg{display:flex;justify-content:space-between;gap:12px;color:var(--dim2);font-size:13px;flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:5px;height:34px;margin-top:8px}
.spark i{width:14px;background:var(--orange);border-radius:2px;display:block}
.histlist{margin-top:10px;border-top:1px solid var(--line)}
.histrow{display:grid;grid-template-columns:minmax(6rem,1.3fr) 6rem 4.5rem 6.5rem;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.histrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histrow .blk{color:var(--txt);text-align:right}
.histrow .pc{color:var(--orange-t);text-align:right}
.histrow .sh{color:var(--dim2);text-align:right;font-size:13px}
@media (max-width:38rem){.histrow{grid-template-columns:1fr auto;row-gap:2px}.histrow .pc,.histrow .sh{text-align:right}}
.whobox{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:16px}
.whohead{margin-bottom:12px}
.whorow{display:grid;grid-template-columns:minmax(7rem,1.2fr) minmax(0,2fr) 6rem 4.5rem;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.whorow .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whorow .track{height:8px;background:var(--panel3);border-radius:999px;overflow:hidden;display:block}
.whorow .track>span{display:block;height:100%;background:var(--orange);border-radius:999px}
.whorow .blk{font-size:13px;color:var(--dim2);text-align:right}
.whorow .pc{font-size:14px;color:var(--orange-t);text-align:right}
@media (max-width:34rem){.whorow{grid-template-columns:1fr 4.5rem;}.whorow .track{display:none}.whorow .blk{text-align:left;grid-column:1}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px}
input[type=range]::-moz-range-track{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--orange);border:3px solid var(--bg);margin-top:-10px;box-shadow:0 0 0 1px var(--orange)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--orange);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--orange)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pbtn{min-height:40px;padding:0 12px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.pbtn:hover{border-color:var(--blue);color:var(--blue)}
.viable{margin-top:12px;background:rgba(var(--green-rgb), .08);border:1px solid rgba(var(--green-rgb), .35);border-radius:10px;padding:14px 16px;font-size:15px}

/* El plazo alternativo dentro del recorrido. Azul y con la palabra "si se
   separan" delante: el color no es lo unico que dice que es un supuesto. */
.tl-est{display:block;margin-top:4px;font-size:12px;color:var(--blue);line-height:1.35}
.tl-est.same{color:var(--dim2)}

/* --- el tiempo se estira: dos railes y una fila por hito --- */
.str-lead{font-size:17px;color:var(--txt);max-width:58ch}
.str-rail{margin-top:20px}
.str-rail-k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.str-rail.is-slow .str-rail-k{color:var(--blue)}
.str-rail.is-fast .str-rail-k{color:var(--green)}
.str-line{position:relative;height:26px;margin-top:8px;background:var(--panel3);border:1px solid var(--line);border-radius:6px}
.str-fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px 0 0 5px;background:rgba(var(--blue-rgb), .16);border-right:2px solid var(--blue)}
.str-rail.is-fast .str-fill{background:rgba(var(--green-rgb), .16);border-right-color:var(--green)}
/* Marca de forma ademas de color: rombo la cadena unica, circulo la
   minoritaria. Se distingue en blanco y negro y con daltonismo. */
.str-pt{position:absolute;top:50%;width:13px;height:13px;margin:-7px 0 0 -7px;background:var(--panel);border:2px solid var(--blue);border-radius:50%}
.str-rail.is-fast .str-pt{border-color:var(--green);border-radius:2px;transform:rotate(45deg)}
/* Cuota 0: el rail no termina, y se ve que no termina. */
.str-line.is-open .str-fill{border-right-style:dashed}
.str-axis{position:relative;height:30px;margin-top:16px;border-top:1px solid var(--line)}
.str-tick{position:absolute;top:0;height:6px;border-left:1px solid var(--line2)}
.str-tick span{position:absolute;top:9px;left:0;transform:translateX(-50%);font-size:12px;color:var(--dim2);white-space:nowrap}
.str-tick:first-child span{transform:none}
.str-tick:last-child span{transform:translateX(-100%)}
.str-row{border-top:1px solid var(--line);padding:14px 0}
.str-row:last-child{border-bottom:1px solid var(--line)}
.str-row-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.str-row-h b{font-size:16px;font-weight:600;color:var(--txt)}
.str-row-h .str-height{font-size:13px;color:var(--dim2)}
.str-cmp{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 7rem;gap:6px 12px;align-items:center;margin-top:8px}
.str-cmp .k{font-size:13px;color:var(--dim)}
.str-cmp .b{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.str-cmp .b>i{display:block;height:100%;border-radius:999px;background:var(--green)}
.str-cmp.slow .b>i{background:var(--blue)}
.str-cmp .v{font-size:14px;color:var(--txt);text-align:right}
.str-mult{margin-top:8px;font-size:13px;color:var(--dim)}
.str-mult b{color:var(--blue);font-weight:700}
.str-assume{margin-top:6px;padding-left:18px;font-size:14px;color:var(--txt2);max-width:68ch}
.str-assume li+li{margin-top:5px}
@media (max-width:34rem){
  /* A 320 px cae la barra, nunca el numero: el numero es el dato. */
  .str-cmp{grid-template-columns:1fr auto;gap:2px 10px}
  .str-cmp .b{display:none}
  .str-line{height:22px}
}

.poolrow{display:grid;grid-template-columns:minmax(9rem,1.4fr) minmax(0,3fr) 5rem;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.poolrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.poolrow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.poolrow .nm span:last-child{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poolrow .track{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.poolrow .track>div{height:100%;border-radius:999px}
.poolrow .pc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;text-align:right;color:var(--dim)}

.riskrow{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.riskrow .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--orange-t);padding-top:2px}
.riskrow .t{font-size:15px;max-width:64ch}

.warnhead{font-size:20px;font-weight:550;color:var(--orange-t);max-width:60ch}
.skel{height:80px;background:var(--panel);border:1px solid var(--line);border-radius:10px;opacity:.6}
.err{color:var(--red);font-size:15px}
.calc{color:var(--blue);font-size:15px}

footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim2);font-size:13px;max-width:72ch}
footer p+p{margin-top:8px}
/* Los dos enlaces del pie eran dos lineas subrayadas y no los veia nadie.
   Son las dos puertas que abren lo que el panel promete: la metodologia
   demuestra y el codigo se lee. Van como tarjetas, con icono y una linea
   que dice para que sirve cada una.
   Los iconos son SVG en linea, no ficheros: la pagina no carga NADA de
   fuera y hay un test que lo comprueba. */
.flinks{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 4px}
.flink{display:flex;align-items:center;gap:13px;flex:1 1 250px;min-width:0;
  padding:13px 15px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--txt);text-decoration:none;
  transition:border-color .18s ease,background .18s ease}
.flink:hover{border-color:var(--orange);background:var(--panel2);color:var(--txt)}
.fico{width:22px;height:22px;flex:none;color:var(--orange-t)}
.flink:hover .fico{color:var(--orange)}
.fico.solid{fill:currentColor}
.fico.line{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ftxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.ftxt b{font-size:14px;font-weight:600}
.ftxt i{font-style:normal;font-size:12.5px;color:var(--dim2)}
@media (prefers-reduced-motion:reduce){.flink{transition:none}}

:focus-visible{outline:2px solid var(--orange-t);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="top">

<header>
  <div>
    <a class="brand" href="#top" id="brand-top">
      <img class="logo" src="/static/logo.png" width="44" height="44"
       alt="Decentralized" loading="eager" decoding="async">
      <h1>BIP-110 <span>Observer</span></h1></a>
    <p class="tagline" id="tagline"></p>
    <!-- La frescura se mide en bloques, no en horas de reloj. Todo lo demas
         del panel se mide asi, y ademas la altura es un hecho objetivo
         mientras que la hora es la del reloj de quien mira. -->
    <p class="fresh" id="fresh" hidden><span class="dot" id="fresh-dot"></span><span id="fresh-txt"></span></p>
  </div>
  <nav aria-label="Language">
    <a class="donate-nav" href="https://github.com/decentralizedb/bip110-observer"
       target="_blank" rel="noopener noreferrer" id="gh-nav">
      <span aria-hidden="true">&lt;/&gt;</span> <span data-k="navCode"></span></a>
    <!-- "Donar", no "Apoyar": en un panel sobre el BIP-110, apoyar se lee
         como apoyar la propuesta. -->
    <a class="donate-nav" href="#donate"><span aria-hidden="true">&#9889;</span>
      <span data-k="donateNav"></span></a>
    <button type="button" class="lang" id="theme" onclick="toggleTema()"
            aria-label="tema"><span id="theme-ico">&#9789;</span></button>
    <button type="button" class="lang" id="l-en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang" id="l-es" onclick="setLang('es')">ES</button>
  </nav>
</header>

<section class="answer" style="margin-top:24px">
  <p class="q" data-k="answerQ"></p>
  <p class="a" data-k="answerA"></p>
  <p class="lead" data-k="answerLead"></p>

  <!-- Si ya ha pasado algo. Va pegado a la respuesta porque es la misma
       conversacion, y antes habia que bajar a buscarlo. -->
  <div id="herostat"><div class="skel" style="margin-top:16px;height:56px"></div></div>

  <!-- El aviso de estafas NO se pliega. Es lo unico de esta pagina que
       puede costarle dinero al lector, y quien llega asustado es el mas
       expuesto. Lo que se pliega es la explicacion, no la advertencia.
       Va DELANTE de la cuenta atras, y esto no es cosmetico: medido en un
       movil real el 2026-08-07, subir la cuenta atras entera empujo el
       aviso por debajo del pliegue. Cuando el orden de arriba deja de
       caber, lo que cae es lo ultimo, asi que lo que no puede caer se
       pone antes. Saber cuanto falta puede esperar un scroll; saber que
       nadie te va a pedir la frase semilla, no. -->
  <div class="caveat caveat--sample">
    <div class="caveat-k" data-k="riskKicker"></div>
    <div class="caveat-b" style="font-size:15px" data-k="riskShort"></div>
  </div>

  <!-- Y cuando es lo siguiente. -->
  <div id="herocd"><div class="skel" style="margin-top:16px;height:150px"></div></div>

  <!-- Decir donde puede terminar la visita. Para la mayoria la respuesta
       ya esta dada, y sin esto la pagina parece pedir que se lea entera. -->
  <p class="bound" data-k="boundary"></p>
  <div class="heroacts">
    <button type="button" class="more" id="answer-toggle" aria-expanded="false"
            aria-controls="answer-more" onclick="toggleAnswer()"></button>
    <button type="button" class="more" id="share-btn" data-k="share" onclick="compartir()"></button>
  </div>
  <div id="answer-more" hidden>
    <p data-k="answerP1"></p>
    <p data-k="answerP2"></p>
  </div>
</section>

<section>
  <div class="shead"><h2 data-k="legendTitle"></h2></div>
  <div class="grid grid-15">
    <div class="panel t-data" style="padding:14px 16px">
      <div class="caveat-k g" data-k="tagData"></div>
      <div style="font-size:15px;color:var(--dim);margin-top:6px" data-k="legendData"></div>
    </div>
    <div class="panel t-est" style="padding:14px 16px">
      <div class="caveat-k b" data-k="tagEst"></div>
      <div style="font-size:15px;color:var(--dim);margin-top:6px" data-k="legendEst"></div>
    </div>
    <div class="panel t-sample" style="padding:14px 16px">
      <div class="caveat-k o" data-k="tagSample"></div>
      <div style="font-size:15px;color:var(--dim);margin-top:6px" data-k="legendSample"></div>
    </div>
  </div>
</section>

<section>
  <div class="shead"><h2 data-k="chainTitle"></h2><span class="pill p-data" data-k="tagData"></span></div>
  <p class="method" data-k="chainMethod"></p>
  <!-- Tres paradas, no tres botones.
       Los estados no son alternativas: son una secuencia. No se puede
       volver a una cadena sin haberse separado antes. Ese orden es
       informacion, asi que la forma es un recorrido.
       El tramo que ya ha ocurrido va en linea continua y el que no, en
       discontinua: eso dice "esto todavia no ha pasado" sin etiqueta. -->
  <div class="track-wrap">
    <div class="track-head">
      <span class="track-eyebrow" data-k="trackEyebrow"></span>
      <p class="track-lead" data-k="trackLead"></p>
    </div>
    <div class="track" id="track" role="tablist" aria-label="estados">
      <button type="button" class="stop" role="tab" id="st-pre_split" onclick="setView('pre_split')">
        <span class="stop-dot"></span>
        <span class="stop-name" data-k="statePre"></span><span class="stop-now" hidden></span>

 strLeadObs:"Since the split, the BIP-110 chain has produced {share}% of the blocks. That share is measured, not assumed. Its milestones are heights, not dates, so each one takes as long as its own chain takes to reach it.",

 gfAnswer:"No, not what you already hold confirmed.",

 nodesTitle:"Can we know how many nodes back BIP-110?",
 nodesWarnTitle:"No. Not this panel and not any other.",
 nodesLead:"A node does not publish anywhere the rules it enforces. The only thing anyone can observe is what each node says about itself: which software it announces, and whether it declares that it enforces BIP-110. That is what you see below, and right after it, the four reasons why it is a sample and not a headcount.",
 whyTitle:"Why this is a sample and not a headcount",
 c1k:"Self-declared", c1:"Changed with one config line. A Knots node can announce itself as Core and the other way round.",
 c2k:"Listening nodes only", c2:"The crawl connects outward, so it only reaches nodes accepting incoming connections. Nodes behind NAT are left out twice: they cannot be called and they do not advertise. The sample over-represents servers and VPSs.",
 c3k:"Trivially sybilled", c3:"A thousand cloud nodes cost pocket change. Either side can inflate its count in an afternoon.",
 c4k:"Partial network coverage", c4:"The crawl reaches IPv4, IPv6 and Tor. Nodes speaking only i2p or cjdns are out, because reaching them needs a router for those networks.",
 nodesTailKicker:"Even with all four solved",
 nodesWarnTail:"It still would not measure the only thing that decides anything: how much economic activity validates through each node. A node verifying a business's incoming payments weighs more than a thousand idle ones, and from the outside they look identical.",

 rulesKicker:"What that mark is worth",
 moreTech:"Sources and technical detail →",
 rulesBody:"A node can add a mark to its calling card saying it enforces BIP-110. That mark was invented by Bitcoin Knots, it is not part of BIP-110, and it is only a declaration, so nobody can check from outside whether it is true. Running Knots does not mean enforcing BIP-110 either: that depends on the version installed, not on what the configuration file says, and this point is usually reported the wrong way round. Hence separate columns, never added together.",

 answerMore:"Explícamelo", answerLess:"Mostrar menos",
 answerP1:"Tus bitcoin no se mueven solos ni desaparecen. Si tienes un nodo, seguirá validando igual que hoy, y si tienes tus bitcoin en autocustodia, tampoco tienes que tocar tu cartera. Lo único que te pediría decidir algo es querer vender monedas de una cadena nueva, y esa decisión la puedes tomar con calma, o no tomarla.",

 degradedBody:"Ahora mismo no se pueden comparar las dos cadenas. El nodo puede estar funcionando perfectamente: lo que ha fallado es el enlace entre este panel y él, y desde aquí las dos cosas se ven igual. Esto tampoco significa que las cadenas se hayan separado. Un fallo de infraestructura y una bifurcación se parecen desde fuera y no tienen nada que ver.",
 splitAt:"La separación se abrió en el bloque {n}",
 tlTitle:"Las fechas del BIP-110 no son fechas, y hablan de tres momentos distintos",
 tlMethod:"Casi toda la cobertura ha hablado del 8 de agosto como si fuera una fecha única. Pero lo que hay que mirar no lo marca el calendario: son tres momentos distintos, y cada uno llega a una altura de bloque. Confundirlos como uno solo es el error más extendido de todo el debate. El que puede partir la cadena es el primero, y no tiene nada que ver con las reglas de datos, que llegan después. Y ese después puede ser mucho más largo de lo que parece.",
 ms1:"Los nodos con BIP-110 empiezan a rechazar bloques",
 ms1d:"Desde este bloque, un nodo que lleve las reglas del BIP-110 tira cualquier bloque que no traiga la marca. Nadie queda obligado a nada: solo cambia lo que esos nodos aceptan. Esta es la altura donde las cadenas se separan.",
 ms1q1:"¿Qué cambia exactamente?",
 ms1a1:"Hasta este bloque, llevar la marca es voluntario y solo cuenta para el recuento. A partir de aquí, un bloque sin ella es inválido para los nodos que llevan esas reglas, mientras sigue siendo perfectamente válido para todos los demás.",
 ms1q2:"¿Quién lo activa?",
 ms1a2:"Nadie. Ocurre solo cuando la cadena llega al bloque {h}. No hay votación, ni anuncio, ni botón que pulsar.",
 ms1q3:"¿Y eso qué provoca?",
 ms1a3:"Si todos los mineros llevan la marca, no pasa nada y sigue habiendo una sola cadena. Si algunos no la llevan, sus bloques los acepta una parte de la red y los rechaza la otra, y desde ese momento cada grupo sigue una cadena distinta. Si tu nodo no lleva esas reglas, tú no notas nada.",
 ms2:"El resultado queda decidido",
 ms2d:"Para los nodos que llevan esas reglas el cambio queda decidido a partir de aquí, aunque los mineros nunca llegaran al umbral.",
 ms2q1:"¿Por qué justo este bloque?",
 ms2a1:"La ventana en la que apoyarlo es obligatorio termina en el bloque {prev}, y dura exactamente un periodo de dificultad, {periodSize} bloques. El bloque {h} es el siguiente.",
 ms2q2:"¿Qué significa que quede decidido?",
 ms2a2:"Que entrará en vigor en la tercera fecha, y que ya no depende del recuento. Ocurre dijera lo que dijera: para esos nodos no queda nada que contar. No significa que nada se estropee ni que haya ningún riesgo en esta fecha.",
 ms2q3:"¿Cambia algo en las transacciones?",
 ms2a3:"Todavía no. En esta fecha no cambia ninguna regla sobre lo que puedes o no puedes enviar. Solo queda fijado que van a cambiar, y cuándo.",
 ms3:"Las reglas de datos entran en vigor",
 ms3d:"Empiezan a aplicarse las siete restricciones. Lo confirmado antes de este bloque queda exento para siempre.",
 ms3q1:"¿Qué reglas son?",
 ms3a1:"Siete límites a la cantidad de datos arbitrarios que puede llevar una transacción. Van contra el almacenamiento de datos, no contra los pagos: una transacción normal no se ve afectada.",
 ms3q2:"¿Afectan a las monedas que ya tengo?",
 ms3a2:"No. Las monedas confirmadas antes del bloque {h} quedan fuera de las reglas nuevas de forma permanente, durante todo el tiempo que estén en vigor. Está escrito en el propio BIP.",
 ms3q3:"¿Cuánto duran?",
 ms3a3:"Alrededor de un año, y después expiran solas sin que nadie haga nada. Y solo se aplican en la cadena cuyos nodos las hacen cumplir.",

/* Tema.
   Por defecto se respeta lo que diga el sistema: quien tiene el movil en
   claro no quiere que una pagina le deslumbre, y al reves igual. Solo si
   el visitante lo cambia a mano se recuerda su eleccion. */
let TEMA = (function(){
  try{ const t = localStorage.getItem("bip110theme"); if(t === "light" || t === "dark") return t; }catch(e){}
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
    ? "light" : "dark";
})();

function aplicarTema(){
  document.documentElement.setAttribute("data-theme", TEMA);
  const ico = $("theme-ico");
  // Se enseña el sitio al que se va, no donde se esta: sol para ir a claro.
  if(ico) ico.innerHTML = TEMA === "dark" ? "&#9788;" : "&#9789;";
}
function toggleTema(){
  TEMA = TEMA === "dark" ? "light" : "dark";
  try{ localStorage.setItem("bip110theme", TEMA); }catch(e){}
  aplicarTema();
}

let LANG = (function(){
  try{ const s = localStorage.getItem("bip110lang"); if(s === "en" || s === "es") return s; }catch(e){}
  return (navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en";
})();
let VIEW = null;                       // vista elegida por el usuario
const DATA = {miners:null, pools:null, nodes:null, chain:null, history:null, params:null};

/* Parametros del BIP. Nunca escritos a mano: salen de /api/params, que los
   lee de signaling.py, que a su vez cita el .mediawiki oficial. */
const bip = () => (DATA.params && DATA.params.bip) || {};
/* Umbral en porcentaje. De /api/params, no del 55 escrito a mano. */
const thrPct = () => (DATA.params && DATA.params.threshold_pct) ||
  (DATA.miners && DATA.miners.ok && DATA.miners.threshold_pct) || 55;

const t = (k, vars) => {
  let s = (DICT[LANG] && DICT[LANG][k]) || DICT.en[k] || k;
  if(vars) for(const [a,b] of Object.entries(vars)) s = s.split("{"+a+"}").join(b);
  return s;
};
/* El motivo de un fallo llega como CLAVE estable desde la API, no como
   frase: el texto del servidor esta en castellano y servirlo tal cual
   dejaba la version inglesa enseniando espaniol. Si la clave no esta en el
   diccionario se usa el texto que venga, que es mejor que un "err_xxx". */
const errTxt = d => {
  if(!d) return "";
  const k = d.motivo ? "err_" + d.motivo : null;
  return (k && t(k) !== k) ? t(k) : (d.error || "");
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n === null || n === undefined || isNaN(n)) ? "—" :
  Number(n).toLocaleString(LANG === "es" ? "es-ES" : "en-US");
const num = (v, d) => (v === null || v === undefined || isNaN(v)) ? "—" :
  Number(v).toLocaleString(LANG === "es" ? "es-ES" : "en-US",
    {minimumFractionDigits:d, maximumFractionDigits:d});

/* Estado real que dice el backend. Nunca lo decide el usuario. */
const realState = () => (DATA.chain && DATA.chain.ok && DATA.chain.state) || "pre_split";
const shownState = () => VIEW || realState();

function paintStatic(){
  const B = bip();
  const P = DATA.pools && DATA.pools.ok ? DATA.pools : null;
  const P0 = DATA.params || {};
  // Nombres largos y descriptivos a proposito. Con marcadores de una letra

  // al otro al fusionarlos, y el panel llego a decir "10.080 pools
  // identificados" cuando eran los bloques del historico.
  const vars = Object.assign({
    sampleBlocks: P ? fmt(P.sample_blocks) : "—",
    poolsIdent:   P ? fmt(P.pools_identified) : "—",
    unattrPct:    P ? num(P.unattributed_pct, 2) : "—",
  }, constVars());
  const coal = coalitionVars();
  const choque = Object.keys(vars).filter(k => k in coal);
  if(choque.length) console.warn("marcadores duplicados:", choque);

  });

      fmt(B.threshold_num) + "/" + fmt(B.period) + " (" +

       <div class="caveat-k">${esc(t("c"+i+"k"))}</div>
       <div class="caveat-b">${esc(t("c"+i))}</div>

}

/* Pool que mas señaliza, y su cuota. Sale de /api/history (periodos
   cerrados) cruzado con /api/pools (cuota actual). Cero cifras a mano. */
function coalitionVars(){
  const h = DATA.history && DATA.history.ok ? DATA.history : null;
  const P = DATA.pools && DATA.pools.ok ? DATA.pools : null;
  if(!h || !h.top_pool) return {pool:"—", share:"—", a:"—", b:"—", others:"—",
                                histBlocks:"—", firstPeriod:"—", lastPeriod:"—"};
  const row = P ? (P.pools || []).find(r => r.pool === h.top_pool) : null;
  const first = h.periods && h.periods.length ? h.periods[0].period : null;
  const last = h.periods && h.periods.length ? h.periods[h.periods.length-1].period : null;
  return {
    pool: h.top_pool,
    share: row ? num(row.share_pct, 2) : "—",
    a: fmt(h.top_pool_blocks),
    b: fmt(h.signalling_blocks),
    others: fmt(h.other_pools),
    histBlocks: fmt(h.total_blocks),
    firstPeriod: fmt(first), lastPeriod: fmt(last),
  };
}

/* Frescura medida en bloques.
   El punto se enciende un instante cuando entran datos nuevos, y se pone
   naranja si el dato lleva demasiado sin refrescarse. Un reloj viejo pasa
   desapercibido; una altura de bloque congelada mientras la red avanza,
   no. */
let ULTIMA_ALTURA = null;

function paintFresh(){
  const el = $("fresh"), dot = $("fresh-dot"), txt = $("fresh-txt");
  if(!el) return;
  const d = DATA.chain;
  const tip = (d && d.ok && d.nodes && d.nodes.core && d.nodes.core.tip) ||
              (DATA.miners && DATA.miners.ok && DATA.miners.tip) || null;
  const upd = (d && d.ok && d.updated) || (DATA.miners && DATA.miners.updated) || null;
  if(tip == null){ el.setAttribute("hidden",""); return; }
  el.removeAttribute("hidden");

  const seg = upd ? Math.max(0, Math.round(Date.now()/1000 - upd)) : null;
  txt.textContent = t("freshAt", {h: fmt(tip), ago: hace(seg)});

  // Naranja si lleva mas de tres veces su propio TTL sin moverse.
  dot.classList.toggle("old", seg != null && seg > 300);
  if(tip !== ULTIMA_ALTURA){
    ULTIMA_ALTURA = tip;
    dot.classList.add("live");
    setTimeout(() => dot.classList.remove("live"), 1600);
  }
}

/* Cuanto hace, en una sola funcion.
   Habia DOS declaradas con este nombre, y la segunda pisaba a la primera sin
   dar ningun error: se perdio el tramo de segundos y el singular, y la
   cabecera acabo diciendo "1 minutes". Una funcion repetida no falla, se
   sustituye en silencio. */
function hace(seg){
  if(seg == null) return "";
  if(seg < 60) return t("agoSec", {n: fmt(seg)});
  if(seg < 3600) return t("agoMin", {n: fmt(Math.round(seg/60))});
  if(seg < 86400) return t("agoHour", {n: num(seg/3600, 1)});
  return t("agoDay", {n: num(seg/86400, 1)});
}

/* Copiar sin depender de nada externo. Si el navegador no deja usar el
   portapapeles (pasa sin https o en navegadores viejos), se selecciona el
   texto para que se pueda copiar a mano en vez de no hacer nada. */
function copiar(cual){
  const txt = PAGO[cual], btn = $(cual + "-copy");
  const ok = () => {
    btn.textContent = t("donateCopied");
    setTimeout(() => { btn.textContent = t("donateCopy"); }, 1800);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(ok).catch(() => seleccionar(cual));
  } else {
    seleccionar(cual);
  }
}
function seleccionar(cual){
  const el = $(cual + "-val");
  const r = document.createRange();
  r.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

function paintStateButtons(){
  const orden = ["pre_split", "split", "reunified"];
  const real = realState(), shown = shownState();
  const iReal = orden.indexOf(real);
  orden.forEach((s, i) => {
    const b = $("st-" + s);
    if(!b) return;
    b.setAttribute("aria-selected", String(s === shown));
    // done: ya ocurrio.  now: donde estamos.  future: no ha pasado, y por
    // eso el tramo que lleva hasta el va en linea discontinua.
    b.classList.toggle("done", i < iReal);
    b.classList.toggle("now", i === iReal);
    b.classList.toggle("future", i > iReal);
    const marca = b.querySelector ? b.querySelector(".stop-now") : null;
    if(marca){
      marca.textContent = t("stopNow");
      if(i === iReal) marca.removeAttribute("hidden"); else marca.setAttribute("hidden", "");
    }
  });
  // Cada parada dice QUE la dispara, que no cambia. Donde estamos lo dice
  // el punto verde, no el texto.
}

  // core y se pintaba en las dos, asi que la coincidencia salia dibujada

       <div class="caveat-b" style="font-size:15px;max-width:68ch">${esc(t("lagWhy"))}</div></div>` : ""}
    ${solo ? "" : `<div style="color:var(--dim);font-size:15px;margin-top:6px;max-width:64ch">${esc(t("oneChainBody"))}</div>`}
    <div class="grid grid-14" style="margin-top:20px">
      <div class="card"><div class="lbl">${esc(t("nodeCore"))}</div>
        <div class="note" style="margin:6px 0 2px">${esc(t("hashLabel"))}</div>
        <div class="mono ${iguales ? "g" : ""}" style="font-size:15px">${esc(cut(hCore))}</div></div>
      ${solo ? "" : `<div class="card"><div class="lbl">${esc(t("nodeKnots"))}</div>
        <div class="note" style="margin:6px 0 2px">${esc(t("hashLabel"))}</div>
        <div class="mono ${iguales ? "g" : ""}" style="font-size:15px">${esc(cut(hKnots))}</div></div>`}
    </div>
    ${solo || preview ? "" : `<p class="hashnote ${iguales ? "ok" : "no"}">${
        esc(iguales ? t("hashMatch") : t("hashDiffer"))}</p>`}
    ${solo ? "" : `<p class="note" style="max-width:66ch;margin-top:8px">${esc(t("hashWhat"))}</p>`}
    <div class="caveat caveat--sample" style="margin-top:20px">
      <div class="caveat-k">${esc(t("aheadKicker", constVars()))}</div>
      <div class="caveat-b" style="font-size:15px;max-width:66ch">${esc(t("aheadBody"))}</div>
    </div></div>`;
}

function pace(sec){
  if(sec == null) return "—";
  if(sec < 3600) return num(sec/60, 1) + " " + t("minutes");
  return num(sec/3600, 1) + " " + t("hours");
}

// Cuanto hace de algo. Sube a dias porque una rama parada se cuenta en
// dias, y "312,0 horas" no se lee.
// La linea de debajo del ritmo. Dice cuando fue el ultimo bloque y sobre
// cuantos bloques va la media, y las dos cosas hacen falta:
//
//   - Una rama que dejo de producir hace un mes conserva intacta la media
//     que tenia. El intervalo medio no distingue "va despacio" de "esta
//     parada", y esa distincion es la que cambia el calculo entero.
//   - Recien separadas las cadenas la media sale de uno o dos intervalos.
//     Enseñar ese numero igual que uno sacado de 144 bloques seria hacerlo
//     pasar por mas solido de lo que es.
function paceNote(s){
  const partes = [];
  const desde = hace(s.seconds_since_last_block);
  if(desde) partes.push(t("lastBlock", {t: desde}));
  if(s.interval_blocks === 0) partes.push(t("paceNoBlocks"));
  else if(s.interval_blocks != null && s.interval_blocks < 12)
    partes.push(t("paceBase", {n: fmt(s.interval_blocks)}));
  if(!partes.length) return "";
  return `<div class="pacenote">${esc(partes.join(" · "))}</div>`;
}

        /* SIN separador de miles: es un comando para copiar y pegar, y

      <div class="pair">

/* El siguiente hito por delante, o null si ya pasaron todos. Lo usan la
   seccion de la cuenta atras y el heroe, y tiene que ser el MISMO calculo:
   dos sitios de la pagina enseñando hitos distintos seria peor que no
   enseñarlos. */
function siguienteHito(d){
  const ms = (d && d.milestones) || {};
  const orden = [["mandatory_signalling_start", "cdWhat1"],
                 ["forced_lockin",              "cdWhat2"],
                 ["rules_active",               "cdWhat3"]];
  const sig = orden.find(([k]) => !((ms[k] || {}).passed));
  if(!sig) return null;
  return {clave: sig[0], whatKey: sig[1], m: ms[sig[0]] || {}};
}

/* Un nodo parado no es una separacion, pero tampoco es "todo coincide".
   El umbral a partir del cual esto importa lo decide el backend: si pone
   `lagging`, es que el hueco ya no es ruido de propagacion. Aqui no se
   repite ese numero, porque entonces habria dos umbrales que se pueden
   desincronizar y el de la pantalla ganaria sin que nadie lo decidiera. */
function lagNote(d){
  if(!d || !d.ok || !d.lagging) return "";
  // En vista previa no se pinta: seria mezclar un dato medido dentro de un
  // escenario inventado, y el lector no tendria como saber cual es cual.
  if(shownState() !== realState()) return "";
  const partes = [t(d.lagging === "knots" ? "lagBip110" : "lagToday",
                    {n: fmt(d.height_gap)})];
  const nodo = (d.nodes || {})[d.lagging] || {};
  const desde = hace(nodo.seconds_since_last_block);
  if(desde) partes.push(t("lagFor", {t: desde}));
  return `<div class="lagnote">${esc(partes.join(" "))}</div>`;
}

/* Una linea corta que diga en que estado esta la cadena. Sigue al
   conmutador de escenarios (shownState), asi que al mirar "como quedaria"
   el heroe cambia con el resto de la pagina en vez de contradecirla. */
function heroStateLine(){
  const d = DATA.chain;
  if(!d || !d.ok) return null;
  if(d.single_node) return t("singleKicker");
  /* Con un nodo mudo NO se puede decir que coinciden. Sin esta linea el
     heroe caia al caso por defecto y afirmaba "los dos nodos coinciden"
     mientras uno no contestaba, que es una afirmacion que nadie ha medido.
     La seccion de mas abajo si lo avisaba; el heroe, que es lo que lee todo
     el mundo, no. Visto en produccion el 2026-08-08, con la altura
     obligatoria recien alcanzada. */
  if(d.degraded) return t("degradedKicker");
  const shown = shownState();
  /* Se pregunta si o no, asi que se contesta si o no. La altura del corte
     es la prueba, no la respuesta, y vive en la seccion de mas abajo para
     quien quiera comprobarla. */
  if(shown === "split"){
    const desde = hace(d.split_seconds_ago);
    return desde ? t("splitYesFor", {t: desde}) : t("splitYes");
  }
  if(shown === "reunified") return t("reuniKicker");
  return t("oneChainKicker");
}

/* Las otras dos preguntas del heroe.
   Ninguna fila se desmonta cuando falta el dato: se queda el esqueleto, o
   el error si fallo. La altura del primer viewport es parte del diseño, y
   una fila que aparece y desaparece la cambia bajo los pies del lector
   justo mientras esta leyendo. */
function renderHeroStatus(){
  const el = $("herostat"), elcd = $("herocd");
  if(!el || !elcd) return;
  const c = DATA.chain, mi = DATA.miners;
  const skel = h => `<div class="skel" style="height:${h}px"></div>`;

  let f1;
  if(!c)          f1 = `<div class="hcard">${skel(56)}</div>`;
  else if(!c.ok)  f1 = `<div class="hcard"><div class="hlab">${esc(t("heroChainQ"))}</div>
                          ${estadoNoOk(c, "margin-top:6px")}</div>`;
  else            f1 = `<div class="hcard">
      <div class="hrow"><span class="hlab">${esc(t("heroChainQ"))}</span>
        ${(c.degraded || c.single_node) ? "" :
          `<span class="pill p-data">${esc(t("tagData"))}</span>`}</div>
      <div class="hval${(c.degraded || c.single_node) ? " apagado" : ""}">${esc(heroStateLine() || "—")}</div>
      ${(!c.degraded && !c.single_node && shownState() === "split")
        ? `<div class="hcalm">${esc(t("splitStillYours"))}</div>` : ""}
      ${lagNote(c)}</div>`;

  /* La cuenta atras entera, aqui y en ningun otro sitio.
     Estuvo repartida entre el heroe y una seccion propia, y enseñaba el
     mismo numero dos veces en la misma pagina. Las DOS cifras suben, cada
     una con SU etiqueta: los bloques son dato verificable y los dias un
     modelo. Lo que no se puede hacer es subir una y dejar la otra, porque
     entonces el heroe daria una fecha sin decir que es estimada. */
  let f2;
  const hito = mi && mi.ok ? siguienteHito(mi) : undefined;
  if(!mi)                f2 = `<div class="hcard">${skel(150)}</div>`;
  else if(!mi.ok)        f2 = `<div class="hcard"><div class="hlab">${esc(t("cdTitle"))}</div>
                                 ${estadoNoOk(mi, "margin-top:6px")}</div>`;
  else if(hito === null) f2 = `<div class="hcard"><div class="hlab">${esc(t("cdTitle"))}</div>
                                 <div class="cdfoot">${esc(t("cdAllPassed"))}</div></div>`;
  else {
    // Los dos avisos venian con la seccion y no se quedan por el camino.
    // El de la ventana obligatoria es el que toca justo estos dias.
    const avisos = [];
    if((mi.milestones || {}).in_mandatory_window) avisos.push(t("cdInWindow"));
    if(hito.clave === "mandatory_signalling_start" &&
       mi.threshold_blocks != null && mi.signalling_blocks >= mi.threshold_blocks){
      avisos.push(t("cdLockNote"));
    }
    /* EL HITO SE CUENTA EN LA CADENA DONDE OCURRE.
       Los hitos que quedan son reglas del software BIP-110, aplicadas sobre
       la cadena que ese software sigue. Un nodo con las reglas de hoy ni
       siquiera tiene ese despliegue: para el, en el 963.648 no pasa nada.
       Mientras hubo una sola cadena daba igual porque eran la misma. Desde
       la separacion, contarlo sobre la cadena mayoritaria da una fecha diez
       veces mas cercana que la real y responde a quien no ha preguntado. */
    const mino = (DATA.chain && DATA.chain.ok && realState() === "split")
               ? (DATA.chain.minority || null) : null;
    const pr = mi.milestone_projection || {};
    const proyHito = (pr.milestones || []).find(x => x.key === hito.clave);
    const enBip = mino && mino.tip != null;
    const quedan = enBip ? Math.max(0, hito.m.height - mino.tip) : hito.m.blocks_away;
    const plazo  = enBip ? (proyHito ? proyHito.minority_days : null)
                         : hito.m.approx_days;

    f2 = `<div class="hcard">
      <div class="hlab">${esc(t("cdTitle"))}</div>
      <div class="cdgrid">
        <div class="cdbox">
          <div class="caveat-k g">${esc(t("tagData"))}</div>
          <div class="cdnum g">${fmt(quedan)}</div>
          <div class="cdunit">${esc(t("blocks"))} ${esc(t(hito.whatKey))}</div>
        </div>
        <div class="cdbox">
          <div class="caveat-k b">${esc(t("tagEst"))}</div>
          <div class="cdnum b">${esc(strDur(plazo))}</div>
          <div class="cdunit">${esc(enBip ? t("cdPaceBip") : t("cdPaceNote", {sp: normalSpacing()}))}</div>
        </div>
      </div>
      ${enBip ? `<div class="cdfoot">${esc(t("cdOnBip", {h: fmt(mino.tip)}))}</div>` : ""}
      ${avisos.map(a => `<div class="cdfoot o">${esc(a)}</div>`).join("")}
    </div>`;
  }

  // Dos contenedores, no uno, porque el aviso de estafas va entre medias.
  el.innerHTML   = `<div class="hgrid">${f1}</div>`;
  elcd.innerHTML = `<div class="hgrid">${f2}</div>`;
}

/* Compartir sin terceros y sin botones de red social, que son justo los
   que traen scripts ajenos. Se usa lo que trae el navegador, y si no trae
   nada se copia el enlace. */
async function compartir(){
  const btn = $("share-btn");
  const url = location.origin + location.pathname;
  try{
    if(navigator.share){ await navigator.share({title: document.title, url: url}); return; }
    if(navigator.clipboard){
      await navigator.clipboard.writeText(url);
      const antes = btn.textContent;
      btn.textContent = t("shareOk");
      setTimeout(() => { btn.textContent = antes; }, 2000);
      return;
    }
  }catch(e){
    // Cancelar el dialogo de compartir no es un fallo y no se reporta.
    return;
  }
  // Sin API de compartir ni portapapeles: que al menos se vea el enlace.
  prompt(t("share"), url);
}

/* Cuanto falta para la fase obligatoria, arriba del todo.
   Tres cosas que no se pueden perder al tocar esto:

   1. La cuenta de bloques y el plazo NO son lo mismo. La primera sale de
      restar dos alturas y cualquiera la reproduce; la segunda supone un
      ritmo. Van con etiquetas distintas a proposito.
   2. El hito no esta clavado: se coge el primero de los tres que no haya
      pasado. Escribir "faltan X para el 961.632" se vuelve mentira el dia
      que se pase esa altura, y nadie relee la portada buscando eso.
   3. La ventana obligatoria solo existe si el umbral NO se cumple antes.
      Esta en deploymentstatus.h: la comprobacion exige que el despliegue
      siga en STARTED. Si el periodo en curso cierra cumpliendo el umbral,
      pasa a LOCKED_IN y esta cuenta atras se queda sin destino. Por eso
      hay un aviso en vez de seguir contando como si nada. */

function renderTimeline(){
  const d = DATA.miners, el = $("tl");
  if(!d){ el.innerHTML = `<div class="skel"></div>`; return; }
  if(!d.ok){ el.innerHTML = estadoNoOk(d); return; }
  const ms = d.milestones || {};
  const rows = [
    ["mandatory_signalling_start", "ms1", "ms1d", "var(--orange)"],
    ["forced_lockin",              "ms2", "ms2d", "var(--blue)"],
    ["rules_active",               "ms3", "ms3d", "var(--green)"],
  ];
  el.innerHTML = rows.map(([k, tk, bk, c], i) => {
    const m = ms[k] || {};
    const away = m.passed ? t("reached") : fmt(m.blocks_away) + " " + t("blocks");
    const eta  = m.passed ? "" : t("daysAway", {n: num(m.approx_days, 1)});
    const n = i + 1;
    const v = Object.assign(constVars(), {h: fmt(m.height), prev: fmt(m.height - 1)});
    const qa = [1, 2, 3].map(j => {
      const q = t(`ms${n}q${j}`, v), a = t(`ms${n}a${j}`, v);
      return q.startsWith("ms") ? "" :
        `<div class="qa"><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></div>`;
    }).join("");
    // La misma altura, contada en la otra cadena. La primera parada llega
    // igual en las dos porque hasta ahi la cadena es una sola, y decirlo es
    // justo lo que hace entender por que las otras dos se separan.
    let alt = "";
    const pr = d.milestone_projection;
    if(pr && !m.passed){
      if(k === "mandatory_signalling_start"){
        alt = `<span class="tl-est same">${esc(t("tlSameBoth"))}</span>`;
      } else {
        const x = (pr.milestones || []).find(z => z.key === k);
        if(x) alt = `<span class="tl-est">${esc(t("tlIfSplit", {v: strDur(x.minority_days)}))}</span>`;
      }
    }
    return `<div class="tlrow" style="border-left-color:${c}">
      <div class="h" style="color:${c}">${fmt(m.height)}</div>
      <div class="m"><strong>${esc(t(tk))}</strong><span>${esc(t(bk))}</span>
        ${qa ? `<button type="button" class="more small" id="tl-b${n}" aria-expanded="false"
                  aria-controls="tl-x${n}" onclick="toggleBox('tl-x${n}','tl-b${n}')">${esc(t("answerMore"))}</button>
                <div id="tl-x${n}" class="qabox" hidden>${qa}</div>` : ""}</div>
      <div class="r"><b>${esc(away)}</b>${esc(eta)}${alt}</div></div>`;
  }).join("") +
  /* Sobre que cadena se cuenta. Estaba en el heroe, y ahi estorbaba: es una

     h: fmt((ms[(rows.find(r => !(ms[r[0]] || {}).passed) || rows[2])[0]] || {}).height)}))}</div>`;
}

/* Quien señaliza en el periodo en curso.
   Se dibuja como lista, no como etiquetas sueltas: si algun dia señalizan
   diez pools tiene que seguir leyendose, y ademas hace falta sitio para la
   cuota de minado de cada uno, que es el dato que de verdad importa. */
/* El aviso sobre los periodos cerrados NO puede estar escrito dando por
   hecho que solo señaliza un pool. Si algun dia señalizan varios, decir
   "un pool, no un movimiento" seria falso justo el dia que mas se mire.
   Se elige el texto segun lo concentrado que este. */
/* Los periodos ya cerrados.
 *
 * Antes era un parrafo que intentaba contarlo todo, y acababa diciendo
 * "otros pools que señalizaron: 1", un numero donde el lector quiere un
 * nombre. Con cuatro o cinco era peor. La prosa que se adapta se ramifica
 * sin parar y cada rama es una oportunidad de decir algo raro.
 *
 * Ahora los datos van en lista, con nombres, y la prosa se queda en una
 * frase corta que no depende de cuantos sean. */
function histBlock(){
  const h = DATA.history && DATA.history.ok ? DATA.history : null;
  if(!h || !h.periods || !h.periods.length) return "";
  const v = Object.assign({}, coalitionVars(), constVars());

  if(!h.signalling_blocks){
    return `<div class="caveat caveat--sample">
      <div class="caveat-k">${esc(t("histTitle", v))}</div>
      <div class="caveat-b" style="font-size:15px">${esc(t("histNone", v))}</div></div>`;
  }

  const P = DATA.pools && DATA.pools.ok ? (DATA.pools.pools || []) : [];
  const cuota = n => { const r = P.find(x => x.pool === n); return r ? r.share_pct : null; };
  const filas = Object.entries(h.by_pool || {}).sort((a, b) => b[1] - a[1]);
  const uno = filas.length === 1;

  return `<div class="caveat caveat--sample">
    <div class="caveat-k">${esc(t("histTitle", v))}</div>
    <div class="caveat-b" style="font-size:15px;max-width:66ch">${esc(t("histLead", v))}</div>
    <div class="histlist">
      ${filas.map(([nombre, n]) => {
        const c = cuota(nombre);
        return `<div class="histrow">
          <span class="nm">${esc(nombre)}</span>
          <span class="mono blk">${fmt(n)} ${esc(t("blocks"))}</span>
          <span class="mono pc">${esc(t("histOfSig", {pct: num(n / h.signalling_blocks * 100, 0)}))}</span>
          <span class="mono sh">${c == null ? "—" : esc(t("histMining", {pct: num(c, 2)}))}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="caveat-b" style="font-size:15px;max-width:66ch;margin-top:10px">${
      esc(t(uno ? "histOnlyOne" : "histSeveral", Object.assign(v, {poolCount: fmt(filas.length)})))}</div>
  </div>`;
}

function whoBlock(d, p){
  const by = Object.entries(d.signalling_by_pool || {}).sort((a,b) => b[1] - a[1]);
  const title = `<h3 style="margin-top:26px;font-size:17px">${esc(t("whoTitle", {p: fmt(p.index)}))}</h3>`;
  if(!by.length) return title + `<p class="note" style="margin-top:8px">${esc(t("whoNone"))}</p>`;

  const P = DATA.pools && DATA.pools.ok ? (DATA.pools.pools || []) : [];
  const shareOf = name => { const r = P.find(x => x.pool === name); return r ? r.share_pct : null; };
  const known = by.map(([k]) => shareOf(k)).filter(v => v != null);
  const suma = known.reduce((a, b) => a + b, 0);
  const total = by.reduce((a, b) => a + b[1], 0);

  return title + `<div class="whobox">
    <div class="whohead">
      <div><div class="lbl">${esc(t("whoShare"))}</div>
        <div class="mono o" style="font-size:32px;font-weight:700">${known.length ? num(suma, 2) + "%" : "—"}</div>
        <div class="note">${esc(t("whoShareNote", {n: fmt(by.length), b: fmt(total)}))}</div></div>
    </div>
    ${by.map(([k, v]) => {
      const sh = shareOf(k);
      return `<div class="whorow">
        <span class="nm">${esc(k)}</span>
        <span class="track"><span style="width:${Math.min(100, Math.max(3, (sh == null ? 3 : sh / thrPct() * 100)))}%"></span></span>
        <span class="mono blk">${fmt(v)} ${esc(t("blocks"))}</span>
        <span class="mono pc">${sh == null ? "—" : num(sh, 2) + "%"}</span></div>`;
    }).join("")}
  </div>`;
}

/* Constantes que vienen de /api/params, nunca escritas a mano. Incluye
   las que "no van a cambiar": el 55%, los 2016 bloques y los 144 al dia. */
function constVars(){
  const P0 = DATA.params || {}, B = bip();
  return {
    periodSize: B.period ? fmt(B.period) : "…",
    histPeriods: fmt(P0.history_periods != null ? P0.history_periods :
            (DATA.history && DATA.history.ok ? (DATA.history.periods || []).length : 0)),
    bpd: P0.blocks_per_day != null ? fmt(P0.blocks_per_day) : "…",
    splitHeight: B.mandatory_start ? fmt(B.mandatory_start) : "…",
    thr: P0.threshold_pct != null ? num(P0.threshold_pct, 0) :
         (DATA.miners && DATA.miners.ok ? num(DATA.miners.threshold_pct, 0) : "…"),
  };
}

/* La tendencia se mide, no se afirma. "Lo poco que se ha movido" dejaria
   de ser verdad en cuanto empezara a moverse, y nadie releeria el texto. */
function trendText(){
  const h = DATA.history && DATA.history.ok ? DATA.history : null;
  const ps = h ? (h.periods || []) : [];
  if(ps.length < 2) return t("trendNone");
  const first = ps[0].pct, last = ps[ps.length - 1].pct;
  const v = Object.assign(constVars(), {first: num(first, 2), last: num(last, 2)});
  const delta = last - first;
  if(Math.abs(delta) < 0.5) return t("trendFlat", v);
  return t(delta > 0 ? "trendUp" : "trendDown", v);
}

function renderMiners(){
  const d = DATA.miners, el = $("miners");
  if(!d){ el.innerHTML = `<div class="skel" style="margin-top:20px;height:220px"></div>`; return; }
  if(!d.ok){ el.innerHTML = estadoNoOk(d, "margin-top:20px"); return; }

  const pct = d.pct_of_scanned || 0;
  const thr = d.threshold_pct || thrPct();
  const gap = Math.max(0, thr - pct);
  const barPct = Math.min(100, (pct / thr) * 100);
  const H = DATA.history && DATA.history.ok ? DATA.history : null;
  const trend = H ? H.periods.map(p => p.pct) : [];
  // Ojo al denominador: un periodo entero sin señalizacion deja todos los
  // valores a cero, y v/0 pinta "NaN%" en el atributo de estilo.
  const mx = (trend.length ? Math.max.apply(null, trend) : 0) || 1;
  const trendTxt = trend.length ? trend.map(v => num(v, 2)).join(" · ") : "—";
  const p = d.period || {};
  const left = (p.remaining == null) ? "—" : fmt(p.remaining);

  /* DESDE LA SEPARACION, ESTA CIFRA CAMBIA DE SIGNIFICADO.
     Se cuenta sobre la cadena del nodo canonico, que es la de las reglas de
     hoy. Y a partir del corte, un minero que señaliza construye en la OTRA
     rama, asi que sus bloques no estan aqui: esta cuenta tiende a cero por
     construccion. El numero sigue siendo verdad y sigue siendo verificable,
     pero contesta a otra pregunta que antes del corte, y sin decirlo se lee
     como "ya no señaliza nadie", que es falso. */
  const partido = (DATA.chain && DATA.chain.ok && realState() === "split");
  const avisoPartido = partido ? `<div class="caveat caveat--sample" style="margin-top:20px">
      <div class="caveat-k">${esc(t("mSplitKicker"))}</div>
      <div class="caveat-b" style="font-size:15px;max-width:68ch">${esc(t("mSplitBody"))}</div>

  el.innerHTML = avisoPartido + `<div class="panel t-data" style="margin-top:20px">
    <div class="caveat-k">${esc(t("gapKicker", constVars()))}</div>
    <div class="gapnum"><span class="n">${num(gap, 2)}</span><span class="u">${esc(t("gapUnit", constVars()))}</span></div>
    <div style="font-size:15px;color:var(--dim);margin-top:10px;max-width:64ch">${
      esc(t("gapBody", Object.assign({n: num(pct, 2)}, constVars())))} ${esc(trendText())}</div>
    <div class="bar"><div style="width:${barPct}%"></div></div>
    <div class="barlg"><span class="mono">${num(pct, 2)}%</span><span>${esc(t("barLegend", constVars()))}</span><span class="mono">${constVars().thr}%</span></div>
    <div class="grid" style="margin-top:22px">
      <div class="card"><div class="lbl">${esc(t("mSig"))}</div>
        <div class="val o">${fmt(d.signalling_blocks)}</div>
        <div class="note">${esc(t("mSigOf", {n: fmt(p.scanned)}))}</div></div>
      <div class="card"><div class="lbl">${esc(t("mTip"))}</div>
        <div class="val">${fmt(d.tip)}</div>
        <div class="note">${esc(t("mTipNote", {p: fmt(p.index), a: fmt(p.start), b: fmt(p.end)}))}</div></div>
      ${(() => {
        // Tres estados. Con solo "alcanzable si/no", un periodo que YA ha
        // cumplido el umbral se contaba como posibilidad, y ese es el dia
        // en que la propuesta sale adelante.
        const cumplido = d.signalling_blocks >= d.threshold_blocks;
        const clave = cumplido ? "reachMet" : (d.threshold_reachable ? "reachYes" : "reachNo");
        /* Con las cadenas separadas, "las cuentas dan" se lee como "aun
           puede activarse", y en ESTA cadena los bloques que llevarian la
           marca se estan minando en la otra. La cifra no cambia; lo que
           cambia es lo que significa, y eso hay que decirlo. */
        const partidas = realState() === "split";
        const nota  = cumplido ? "reachMetNote"
                    : (d.threshold_reachable ? (partidas ? "mReachNoteSplit" : "mReachNote")
                                             : "reachNoNote");
        const color = cumplido ? "g" : (d.threshold_reachable ? "b" : "o");
        return `<div class="card"><div class="lbl">${esc(t("mReach", constVars()))}</div>
          <div class="val ${color}">${esc(t(clave))}</div>
          <div class="note">${esc(t(nota, {t: fmt(d.threshold_blocks), r: left,
            sig: fmt(d.signalling_blocks), periodSize: fmt(bip().period)}))}</div></div>`;
      })()}
      <div class="card"><div class="lbl">${esc(t("mTrend", {n: fmt(trend.length)}))}</div>
        <div class="spark">${trend.map((v,i) => `<i title="${esc(H.periods[i].period)}: ${num(v,2)}%" style="height:${Math.max(4,Math.round(v/mx*100))}%"></i>`).join("")}</div>

/* Cuantos pools señalizan HOY y cuanto minado suman. "Solo señaliza X"
   es una conclusion con fecha de caducidad, asi que se elige el texto. */
function coalitionText(){
  const P = DATA.pools && DATA.pools.ok ? (DATA.pools.pools || []) : [];
  const firman = P.filter(r => r.signalling_blocks > 0);
  const v = Object.assign(constVars(), coalitionVars());
  if(firman.length <= 1) return t("coalitionBody", v);
  const suma = firman.reduce((a, r) => a + r.share_pct, 0);
  // Si ya suman por encima del umbral, decir "quedan 0 puntos" es absurdo.
  // Y ahi hace falta el matiz: cuota de minado no es señalizacion medida.
  return t(suma >= thrPct() ? "coalitionBodyOver" : "coalitionBodyMany", Object.assign(v, {
    poolCount: fmt(firman.length),
    sigShare: num(suma, 2),
    gapShare: num(Math.max(0, thrPct() - suma), 2),
  }));
}
