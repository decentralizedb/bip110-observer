<style>
/* La paleta es la MISMA que la del panel, variable por variable.
   Esta pagina estuvo con los colores escritos a mano y solo en oscuro: el
   visitante que leia el panel en claro pulsaba "Metodologia" y se topaba
   con una pagina negra. Justo la pagina que existe para dar confianza era
   la que parecia de otro sitio.
   El tema se guarda en la misma clave del navegador, asi que la eleccion
   viaja entre las dos paginas sin que haya que repetirla. */
:root{
  --bg:#0d0f12;      --panel:#161a20;   --panel2:#1e232b;  --panel3:#12151a;
  --line:#2b323d;
  --txt:#eceef1;     --txt2:#d6dae0;    --dim:#a8b0bd;   --dim2:#9aa4b2;
  --orange:#E7640F;  --orange-t:#FF8A3D; --orange-rgb:231,100,15;
  --green:#4CC96A;   --green-rgb:76,201,106;
  --blue:#5AA9E6;    --blue-rgb:90,169,230;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f7fa;      --panel:#ffffff;   --panel2:#eef1f6;  --panel3:#e7ebf1;
  --line:#d8dee7;
  --txt:#11151c;     --txt2:#2b3340;    --dim:#4a5462;   --dim2:#545d6b;
  --orange:#C4520C;  --orange-t:#A8440A; --orange-rgb:196,82,12;
  --green:#0D5F2D;   --green-rgb:13,95,45;
  --blue:#175FA8;    --blue-rgb:23,95,168;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;font-size:17px;line-height:1.65;font-weight:350;letter-spacing:-.003em}
a{color:var(--orange-t);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--txt)}
.wrap{max-width:52rem;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{border-radius:50%;flex-shrink:0;display:block}
h1{font-size:30px;font-weight:650;line-height:1.15;letter-spacing:-.02em}
h1 span{color:var(--orange-t)}
nav{display:flex;gap:4px;flex-shrink:0}
.lang{min-height:44px;min-width:44px;padding:0 14px;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.lang[aria-pressed="true"]{background:rgba(var(--orange-rgb),.14);border-color:var(--orange);color:var(--orange-t);font-weight:600}
.back{font-size:14px;margin-top:10px;display:inline-block}
section{margin-top:40px}
h2{font-size:22px;font-weight:650;letter-spacing:-.015em;margin-bottom:10px}
h3{font-size:17px;font-weight:600;margin:22px 0 6px}
p{max-width:66ch;margin-top:10px;color:var(--txt2)}
ul{margin:10px 0 0 20px;max-width:66ch;color:var(--txt2)}
li{margin-top:6px}
.pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;display:inline-block}
.p-data{background:rgba(var(--green-rgb),.14);color:var(--green);border:1px solid rgba(var(--green-rgb),.35)}
.p-est{background:rgba(var(--blue-rgb),.14);color:var(--blue);border:1px solid rgba(var(--blue-rgb),.35)}
.p-sample{background:rgba(var(--orange-rgb),.14);color:var(--orange-t);border:1px solid rgba(var(--orange-rgb),.35)}
pre{background:var(--panel3);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:12px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;color:var(--dim)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;color:var(--orange-t)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px;display:block;overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim2);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.caveat{border-left:2px solid var(--orange);padding-left:14px;margin-top:18px}
.caveat-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-t)}
.caveat-b{font-size:15px;color:var(--dim);margin-top:4px;max-width:66ch}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim2);font-size:13px;max-width:66ch}
:focus-visible{outline:2px solid var(--orange-t);outline-offset:2px}

/* EL CUARTO NIVEL, Y POR QUE NO ES NINGUNO DE LOS TRES COLORES.
   Verde, azul y naranja ya significan algo en este proyecto. Lo que dice un
   tercero que no podemos comprobar no es ninguna de esas tres cosas, asi que
   pintarlo con su color seria ascenderlo de nivel por la puerta de atras.
   Va en gris, sin color propio, que es exactamente lo que vale. */
.p-ext{background:var(--panel2);color:var(--dim);border:1px dashed var(--line)}
/* La frontera. Es el mensaje de la pagina, asi que se ve. */
.horizon{margin:40px 0 8px;border-top:2px dashed var(--orange);padding-top:16px}
.horizon h2{color:var(--orange-t)}
.zone-ext{opacity:.92}
.zone-ext table{border-left:2px dashed var(--line);padding-left:10px}
.src{font-size:12px;color:var(--dim2);white-space:nowrap}
.gap-big{color:var(--orange-t);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.check{border:1px solid rgba(var(--green-rgb),.35);background:rgba(var(--green-rgb),.07);border-radius:10px;padding:14px 16px;margin-top:14px}
.check .big{font-size:22px;font-weight:650;color:var(--green);font-variant-numeric:tabular-nums}
.lead{font-size:19px;color:var(--txt);max-width:66ch;margin-top:12px}
.closed{border:1px solid var(--orange);border-radius:10px;padding:14px 16px;margin-top:18px;background:rgba(var(--orange-rgb),.07)}
.closed .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-t)}
[hidden]{display:none!important}
</style>
</head>

let TEMA = (function(){
  try{ const t = localStorage.getItem("bip110theme"); if(t === "light" || t === "dark") return t; }catch(e){}
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
    ? "light" : "dark";
})();
function aplicarTema(){
  document.documentElement.setAttribute("data-theme", TEMA);
  const ico = document.getElementById("theme-ico");
  if(ico) ico.innerHTML = TEMA === "dark" ? "&#9788;" : "&#9789;";
}
function toggleTema(){
  TEMA = TEMA === "dark" ? "light" : "dark";
  try{ localStorage.setItem("bip110theme", TEMA); }catch(e){}
  aplicarTema();
}
aplicarTema();
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  if(mq.addEventListener) mq.addEventListener("change", e => {
    let guardado = null;
    try{ guardado = localStorage.getItem("bip110lang"); }catch(err){}
    let gt = null;
    try{ gt = localStorage.getItem("bip110theme"); }catch(err){}
    if(!gt){ TEMA = e.matches ? "light" : "dark"; aplicarTema(); }
  });
}

let LANG = (function(){
  try{ const s = localStorage.getItem("bip110lang"); if(s === "en" || s === "es") return s; }catch(e){}
  return (navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en";
})();
function setLang(l){
  LANG = l;
  try{ localStorage.setItem("bip110lang", l); }catch(e){}
  document.documentElement.lang = l;
  paint();
}

let TL = null;
const loc = () => LANG === "es" ? "es-ES" : "en-US";
const nf = (v,d) => (v==null||isNaN(v)) ? "—" :
  Number(v).toLocaleString(loc(),{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function t(k, vars){
  const D = DICT[LANG] || DICT.en;
  let v = D[k];
  if(v === undefined) return "";
  for(const [a,b] of Object.entries(vars || {})) v = v.split("{"+a+"}").join(b);
  return v;
}
/* Fecha y hora en UTC siempre. Un cronograma que se pinta en la zona
   horaria del lector cuenta una historia distinta a cada uno, y aqui lo
   que importa es que dos personas puedan comparar la misma tabla. */
function fechaUTC(seg, conHora){
  if(!seg) return "—";
  const d = new Date(seg * 1000);
  const o = conHora
    ? {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"}
    : {day:"2-digit", month:"short", year:"numeric"};
  return new Intl.DateTimeFormat(loc(), Object.assign({timeZone:"UTC"}, o)).format(d);
}
function fechaISO(iso){
  if(!iso) return "—";
  const p = iso.split("-");
  return fechaUTC(Date.UTC(+p[0], +p[1]-1, +p[2]) / 1000, false);
}
/* Una duracion se dice en la unidad que la hace legible, y el plural se
   elige por la cifra QUE SE IMPRIME, no por la de dentro: 0,6 y 1,4 horas
   se imprimen las dos como "1". */
function dur(seg){
  if(seg == null) return "—";
  const h = seg / 3600;
  if(h < 48) return nf(h, 1) + " h";
  const d = Math.round(h / 24);
  return nf(d, 0) + (LANG === "es" ? (d === 1 ? " día" : " días")
                                   : (d === 1 ? " day" : " days"));
}

function pintarDocumentados(){
  const tb = document.getElementById("docrows");
  if(!tb) return;
  tb.innerHTML = ((TL && TL.documented) || []).map(e => {
    const cuando = e.date ? fechaISO(e.date)
                 : (e.time ? fechaUTC(e.time, false) : "—");
    return '<tr><td class="num">' + esc(cuando) + '</td><td>' +
      esc(t(e.key, {height: nf(e.height, 0),
                    starttime: e.time ? fechaUTC(e.time, false) : "—"})) +
      '</td></tr>';
  }).join("");
}

function pintarBloques(){
  const tb = document.getElementById("blockrows");
  if(!tb) return;
  const bs = (TL && TL.blocks) || [];
  /* El hueco grande se marca, y no solo con color: el numero ya lo dice y
     el color solo lo subraya. Un paron de cinco dias en una cadena que
     deberia hacer un bloque cada diez minutos es el dato de la tabla. */
  const grande = 24 * 3600;
  tb.innerHTML = bs.map(b => {
    const g = b.gap_sec;
    return '<tr><td class="num">' + esc(nf(b.height, 0)) + '</td>' +
      '<td class="num">' + esc(fechaUTC(b.time, true)) + '</td>' +
      '<td class="num' + (g && g >= grande ? ' gap-big' : '') + '">' +
      esc(g == null ? "—" : nf(g / 3600, 1) + " h") + '</td>' +
      '<td>' + esc(b.pool || "—") + '</td></tr>';
  }).join("");
}

function valorClaim(c){
  if(c.key === "xMarket")
    return nf(c.bid, 0) + " / " + nf(c.ask, 0) + " $ (" + nf(c.spread_pct, 1) + "%)";
  let v = c.unit === "BTC"
        ? Number(c.value).toLocaleString(loc(), {maximumFractionDigits: 3})
        : nf(c.value, c.key === "xHashrate" ? 1 : 0);
  if(c.unit) v += " " + c.unit;
  if(c.pct != null) v += " (" + nf(c.pct, 1) + "%)";
  if(c.factor != null) v += " (x" + nf(c.factor, 0) + ")";
  return v;
}

function pintarExternos(){
  const tb = document.getElementById("extrows");
  if(!tb) return;
  const ex = (TL && TL.external) || {};
  const fuentes = ex.sources || {};
  const filas = (ex.claims || []).map(c => {
    const f = fuentes[c.src] || {};
    const interes = f.interest === "press" ? t("interestPress") : t("interestPromoter");
    const nota = c.derived ? '<div class="src">' + esc(t("derived")) + '</div>' : "";
    return '<tr><td>' + esc(t(c.key, {algo: (TL.horizon || {}).algo || ""})) + nota + '</td>' +
      '<td class="num">' + esc(valorClaim(c)) + '</td>' +
      '<td class="num">' + esc(fechaISO(c.as_of)) + '</td>' +
      '<td><a href="' + esc(f.url || "#") + '" rel="noopener nofollow">' + esc(f.name || "") +
      '</a><div class="src">' + esc(interes) + '</div></td></tr>';
  });
  /* LO QUE NO SE ENCONTRO VA EN LA TABLA, NO OMITIDO.
     Un hueco callado parece un cero, y "no lo publica nadie" es informacion
     distinta de "es cero". Es la misma regla que hace que /api/nodes diga
     que redes NO sondea. */
  (ex.not_found || []).forEach(k => {
    filas.push('<tr><td>' + esc(t(k)) + '</td><td class="src" colspan="3">' +
      esc(t("notFound")) + '</td></tr>');
  });
  tb.innerHTML = filas.join("");
}

function pintarComprobacion(){
  const c = TL && TL.retarget_check;
  const caja = document.getElementById("checkbox");
  const big = document.getElementById("checkbig");
  const txt = document.getElementById("checktxt");
  if(!caja || !big || !txt) return;
  if(!c){ caja.hidden = true; return; }
  caja.hidden = false;
  /* El signo lo lleva ya la palabra "caida", asi que la cifra va en valor
     absoluto: "cayo un -41,3%" dice justo lo contrario de lo que paso. */
  big.textContent = nf(Math.abs(c.computed_pct), 1) + "%  =  " +
                    nf(Math.abs(c.claimed_pct), 1) + "%";
  txt.textContent = t("checkTxt", {
    days: nf(c.days, 2), target: nf(c.target_days, 0),
    computed: nf(Math.abs(c.computed_pct), 1), claimed: nf(Math.abs(c.claimed_pct), 1)
  });
}

function paint(){
  const D = DICT[LANG] || DICT.en;
  const bs = (TL && TL.blocks) || [];
  const hz = (TL && TL.horizon) || {};
  const primero = bs[0] || {};
  const ultimo = bs[bs.length - 1] || {};
  const dias = (primero.time && ultimo.time)
    ? (ultimo.time - primero.time) / 86400 : null;
  /* `majTime` es cuanto tardo la cadena mayoritaria en hacer ESOS MISMOS
     bloques. Es la comparacion que hace entender la tabla de un vistazo, y
     sale del objetivo de diez minutos por bloque, que es lo que la
     mayoritaria cumple. Se calcula, no se escribe. */
  const vars = {
    forkDate: fechaISO(hz.date),
    fork: nf(hz.height, 0),
    algo: hz.algo || "—",
    common: nf(TL && TL.last_common_height, 0),
    common2: nf(TL && TL.split_height, 0),
    n: nf(bs.length, 0),
    days: dias == null ? "—" : nf(dias, 0),
    majTime: (TL && TL.majority_same_span_sec != null)
             ? dur(TL.majority_same_span_sec) : "—",
    claimed: TL && TL.retarget_check
             ? nf(Math.abs(TL.retarget_check.claimed_pct), 1) : "—"
  };
  document.querySelectorAll("[data-k]").forEach(el => {
    const v = t(el.dataset.k, vars);
    if(v !== "") el.textContent = v;
  });
  pintarDocumentados();
  pintarBloques();
  pintarExternos();
  pintarComprobacion();
  document.getElementById("l-en").setAttribute("aria-pressed", LANG === "en");
  document.getElementById("l-es").setAttribute("aria-pressed", LANG === "es");
  document.title = (LANG === "es" ? "Cronograma" : "Timeline") + " · BIP-110 Observer";
}
document.documentElement.lang = LANG;
paint();
fetch("/api/timeline").then(r => r.json()).then(d => { if(d && d.ok){ TL = d; paint(); } })
  .catch(() => {});
</script>
